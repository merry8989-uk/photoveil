name: CI

# Compile check on every push, so a broken build never reaches a tag.
# Also produces an unsigned release APK: the maintainer signs it with the
# permanent key and publishes it, which keeps key material out of CI entirely.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: test -f gradlew || gradle wrapper --gradle-version 8.9

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photoveil-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Assemble unsigned release
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: photoveil-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
